<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Security Verification Protocol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #030712;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(13, 20, 36, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 32px 24px;
      border-radius: 28px;
      width: 100%;
      max-width: 430px;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.15);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      animation: scanLine 3s linear infinite;
    }

    @keyframes scanLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .card.scanning { border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 45px rgba(56, 189, 248, 0.25); }
    .card.verified { border-color: rgba(34, 197, 94, 0.7); box-shadow: 0 0 55px rgba(34, 197, 94, 0.35); }
    .card.banned { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 55px rgba(239, 68, 68, 0.4); animation: glitchCard 0.4s ease; }

    @keyframes glitchCard {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(3px, 3px); }
    }

    .icon-glow {
      width: 95px;
      height: 95px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      position: relative;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(15, 23, 42, 0.85) 70%);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    
    .scanning .icon-glow { animation: radarPulse 1.8s infinite ease-in-out; }
    .verified .icon-glow { background: radial-gradient(circle, rgba(34, 197, 94, 0.35) 0%, rgba(15, 23, 42, 0.85) 70%); border-color: #22c55e; box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }
    .banned .icon-glow { background: radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, rgba(15, 23, 42, 0.85) 70%); border-color: #ef4444; box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); }

    @keyframes radarPulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 25px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-family: 'Orbitron', sans-serif;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .verified .badge { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
    .banned .badge { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

    h2 { 
      font-family: 'Orbitron', sans-serif;
      font-size: 21px; 
      font-weight: 700; 
      margin-bottom: 8px; 
    }
    
    p { font-size: 13.5px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0ea5e9, #6366f1, #38bdf8);
      border-radius: 8px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .details-box {
      background: rgba(3, 7, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      font-size: 12.5px;
      margin-bottom: 16px;
      display: none;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .row:last-child { border-bottom: none; }
    .label { color: #64748b; font-weight: 500; }
    .value { font-weight: 600; color: #e2e8f0; font-family: 'Fira Code', monospace; }

    .terminal-box {
      text-align: left;
      background: #010409;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: none;
    }
    .terminal-header {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-family: 'Orbitron', sans-serif;
    }
    pre {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: #34d399;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 130px;
    }

    .action-btn {
      display: none;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(34, 197, 94, 0.6); }
    .action-btn.banned-btn {
      background: linear-gradient(135deg, #ef4444, #991b1b);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    }
    .watermark {
      margin-top: 15px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div id="card" class="card scanning">
    <div id="badge" class="badge">SECURE PROTOCOL</div>
    <div class="icon-glow" id="icon">🛡️</div>
    <h2 id="title">Initializing Scan...</h2>
    <p id="message">Establishing secure connection & generating hardware device fingerprint...</p>

    <div class="progress-container" id="progressBox">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="details-box" id="detailsGrid"></div>

    <div class="terminal-box" id="apiTerminal">
      <div class="terminal-header">
        <span>⚡ API_RESPONSE.JSON</span>
        <span id="httpStatus">STATUS 200</span>
      </div>
      <pre id="jsonOutput"></pre>
    </div>

    <a href="#" id="redirectBtn" class="action-btn">🚀 RETURN TO TELEGRAM BOT</a>
    <div class="watermark">SECURE ENCRYPTED GATEWAY</div>
  </div>

  <script>
    function generateDeviceFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('Kumar_Security_Protocol_v3', 2, 2);
      const rawData = [
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '8',
        canvas.toDataURL()
      ].join('||');

      let hash = 0;
      for (let i = 0; i < rawData.length; i++) {
        hash = ((hash << 5) - hash) + rawData.charCodeAt(i);
        hash |= 0;
      }
      return 'DEV-' + Math.abs(hash).toString(16).toUpperCase();
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function executeVerification() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('userid');
      const botName = (urlParams.get('bot') || 'TelegramBot').replace('@', '');

      const card = document.getElementById('card');
      const badge = document.getElementById('badge');
      const icon = document.getElementById('icon');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const progressBar = document.getElementById('progressBar');
      const progressBox = document.getElementById('progressBox');
      const detailsGrid = document.getElementById('detailsGrid');
      const apiTerminal = document.getElementById('apiTerminal');
      const jsonOutput = document.getElementById('jsonOutput');
      const httpStatus = document.getElementById('httpStatus');
      const redirectBtn = document.getElementById('redirectBtn');

      if (!userId) {
        card.className = 'card banned';
        badge.innerText = 'SECURITY ERROR';
        icon.innerText = '⚠️';
        title.innerText = 'Missing User ID';
        message.innerText = 'Access denied! Please open this link directly via your Telegram bot.';
        progressBox.style.display = 'none';
        return;
      }

      progressBar.style.width = '35%';
      await wait(400);
      message.innerText = 'Extracting hardware device traits...';
      progressBar.style.width = '70%';
      await wait(500);
      message.innerText = 'Verifying with Firebase Security Database (@' + botName + ')...';
      progressBar.style.width = '100%';
      await wait(400);

      let deviceId = localStorage.getItem('kumar_device_token');
      if (!deviceId) {
        deviceId = generateDeviceFingerprint();
        localStorage.setItem('kumar_device_token', deviceId);
      }

      try {
        const response = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userid: userId,
            bot: botName,
            deviceId: deviceId
          })
        });

        const result = await response.json();
        
        progressBox.style.display = 'none';
        detailsGrid.style.display = 'block';
        apiTerminal.style.display = 'block';
        redirectBtn.style.display = 'block';
        redirectBtn.href = `https://t.me/${botName}`;

        jsonOutput.innerText = JSON.stringify(result, null, 2);

        if (result.status === 'banned') {
          card.className = 'card banned';
          badge.innerText = 'ACCESS BLOCKED 🚫';
          icon.innerText = '🚫';
          title.innerText = 'Device Banned!';
          message.innerText = 'Multiple distinct Telegram accounts detected on this device. Permanent restriction applied.';
          httpStatus.innerText = 'HTTP 403 FORBIDDEN';
          httpStatus.style.color = '#f87171';
          
          redirectBtn.className = 'action-btn banned-btn';
          redirectBtn.innerText = '🚫 BANNED ON @' + botName;

          detailsGrid.innerHTML = `
            <div class="row"><span class="label">Target Bot</span><span class="value">@${botName}</span></div>
            <div class="row"><span class="label">First User ID</span><span class="value">${result.first_userid}</span></div>
            <div class="row"><span class="label">Blocked User</span><span class="value" style="color:#f87171">${userId}</span></div>
            <div class="row"><span class="label">Device Hash</span><span class="value">${deviceId}</span></div>
            <div class="row"><span class="label">Action</span><span class="value" style="color:#f87171">DIRECT BANNED 🚫</span></div>
          `;
        } else {
          card.className = 'card verified';
          badge.innerText = 'SECURE & VERIFIED ✅';
          icon.innerText = '✅';
          title.innerText = 'Verification Success!';
          message.innerText = 'Device integrity verified. Single account policy respected. You may return to the bot.';
          httpStatus.innerText = 'HTTP 200 OK';
          httpStatus.style.color = '#34d399';
          
          redirectBtn.innerText = '🚀 CONTINUE TO @' + botName;

          detailsGrid.innerHTML = `
            <div class="row"><span class="label">Target Bot</span><span class="value">@${botName}</span></div>
            <div class="row"><span class="label">Telegram ID</span><span class="value">${userId}</span></div>
            <div class="row"><span class="label">Device Hash</span><span class="value">${deviceId}</span></div>
            <div class="row"><span class="label">Status</span><span class="value" style="color:#34d399">VERIFIED ✅</span></div>
          `;
        }
      } catch (err) {
        card.className = 'card banned';
        title.innerText = 'Server Error';
        message.innerText = 'Failed to reach backend API endpoint. Try again later.';
        progressBox.style.display = 'none';
      }
    }

    executeVerification();
  </script>
</body>
</html>
