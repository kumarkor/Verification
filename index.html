<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Device Verification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #090d16 70%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 430px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transition: all 0.4s ease;
      position: relative;
    }

    /* Glow Themes */
    .card.scanning { border-color: #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.25); }
    .card.verified { border-color: #22c55e; box-shadow: 0 0 40px rgba(34, 197, 94, 0.35); }
    .card.banned { 
      border-color: #ef4444; 
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.45); 
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Pulse Scanner Icon */
    .icon-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      position: relative;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid #38bdf8;
    }
    .scanning .icon-wrapper { animation: pulseBlue 1.5s infinite; }
    .verified .icon-wrapper { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); }
    .banned .icon-wrapper { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }

    @keyframes pulseBlue {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      70% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }
    .verified .badge { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .banned .badge { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13.5px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }

    /* Progress Bar */
    .progress-box {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.4s ease;
    }

    /* Info Grid */
    .info-grid {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      font-size: 12.5px;
      margin-bottom: 16px;
      display: none;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #64748b; }
    .info-val { font-weight: 600; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; }

    /* Live API JSON Viewer Box */
    .api-box {
      text-align: left;
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      display: none;
    }
    .api-header {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a5f3fc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Button */
    .btn {
      display: none;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.banned-btn {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body>

  <div id="card" class="card scanning">
    <div id="badge" class="badge">SECURITY SCANNER</div>
    <div class="icon-wrapper" id="icon">🛡️</div>
    <h2 id="title">Scanning Device...</h2>
    <p id="message">Checking hardware fingerprint & multi-account protection...</p>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="info-grid" id="infoGrid"></div>

    <div class="api-box" id="apiBox">
      <div class="api-header">
        <span>⚡ LIVE API RESPONSE</span>
        <span id="httpCode">HTTP 200</span>
      </div>
      <pre id="apiJson"></pre>
    </div>

    <a href="#" id="botBtn" class="btn">🚀 Return to Telegram Bot</a>
  </div>

  <script>
    function generateFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('SuperVerify_FP', 2, 2);
      const raw = [
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '4',
        canvas.toDataURL()
      ].join('|');

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return 'DEV-' + Math.abs(hash).toString(16).toUpperCase();
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function startVerification() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('userid');
      const botName = (params.get('bot') || 'MyTelegramBot').replace('@', '');

      const card = document.getElementById('card');
      const badge = document.getElementById('badge');
      const icon = document.getElementById('icon');
      const title = document.getElementById('title');
      const msg = document.getElementById('message');
      const pBar = document.getElementById('progressBar');
      const pBox = document.getElementById('progressBox');
      const infoGrid = document.getElementById('infoGrid');
      const apiBox = document.getElementById('apiBox');
      const apiJson = document.getElementById('apiJson');
      const httpCode = document.getElementById('httpCode');
      const botBtn = document.getElementById('botBtn');

      if (!userId) {
        card.className = 'card banned';
        badge.innerText = 'INVALID LINK';
        icon.innerText = '⚠️';
        title.innerText = 'Missing User ID!';
        msg.innerText = 'Please open this link directly from the Telegram Bot.';
        pBox.style.display = 'none';
        return;
      }

      // Stylish Scanning Steps
      pBar.style.width = '35%';
      await sleep(500);
      msg.innerText = 'Generating Hardware Device ID...';
      pBar.style.width = '70%';
      await sleep(600);
      msg.innerText = 'Verifying Account with @' + botName + '...';
      pBar.style.width = '100%';
      await sleep(500);

      let deviceId = localStorage.getItem('permanent_dev_id');
      if (!deviceId) {
        deviceId = generateFingerprint();
        localStorage.setItem('permanent_dev_id', deviceId);
      }

      const storageKey = `locked_user_${botName.toLowerCase()}`;
      const previousUser = localStorage.getItem(storageKey);

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userid: userId,
            bot: botName,
            deviceId: deviceId,
            previousUser: previousUser
          })
        });

        const data = await res.json();
        pBox.style.display = 'none';
        infoGrid.style.display = 'block';
        apiBox.style.display = 'block';
        botBtn.style.display = 'block';
        botBtn.href = `https://t.me/${botName}`;

        // Show Live API JSON on Screen
        apiJson.innerText = JSON.stringify(data, null, 2);

        if (data.status === 'banned') {
          card.className = 'card banned';
          badge.innerText = 'ACCESS DENIED 🚫';
          icon.innerText = '🚫';
          title.innerText = 'Device Banned!';
          msg.innerText = 'Multiple accounts detected on the same device for this bot!';
          httpCode.innerText = 'HTTP 403 BANNED';
          httpCode.style.color = '#f87171';
          botBtn.className = 'btn banned-btn';
          botBtn.innerText = '🚫 Account Blocked on @' + botName;

          infoGrid.innerHTML = `
            <div class="info-row"><span class="info-label">Bot Name</span><span class="info-val">@${botName}</span></div>
            <div class="info-row"><span class="info-label">1st User ID</span><span class="info-val">${data.first_userid}</span></div>
            <div class="info-row"><span class="info-label">2nd User ID</span><span class="info-val" style="color:#f87171">${userId}</span></div>
            <div class="info-row"><span class="info-label">Device ID</span><span class="info-val">${deviceId}</span></div>
            <div class="info-row"><span class="info-label">Result</span><span class="info-val" style="color:#f87171">DIRECT BANNED 🚫</span></div>
          `;
        } else {
          localStorage.setItem(storageKey, userId);
          card.className = 'card verified';
          badge.innerText = 'ACCESS GRANTED ✅';
          icon.innerText = '✅';
          title.innerText = 'Successfully Verified!';
          msg.innerText = 'Your device is clean & verified. You can now use the bot.';
          httpCode.innerText = 'HTTP 200 OK';
          httpCode.style.color = '#4ade80';
          botBtn.innerText = '🚀 Continue to @' + botName;

          infoGrid.innerHTML = `
            <div class="info-row"><span class="info-label">Bot Name</span><span class="info-val">@${botName}</span></div>
            <div class="info-row"><span class="info-label">User ID</span><span class="info-val">${userId}</span></div>
            <div class="info-row"><span class="info-label">Device ID</span><span class="info-val">${deviceId}</span></div>
            <div class="info-row"><span class="info-label">Result</span><span class="info-val" style="color:#4ade80">VERIFIED ✅</span></div>
          `;
        }
      } catch (e) {
        title.innerText = 'API Error!';
        msg.innerText = 'Could not connect to server.';
      }
    }

    startVerification();
  </script>
</body>
</html>
